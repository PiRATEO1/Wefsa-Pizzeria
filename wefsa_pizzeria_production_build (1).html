    // Haversine formula to compute geodesic distance in kilometers
    function calculateDistanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371; // Earth radius in km
      const dLat = (lat2 - lat1) * (Math.PI / 180);
      const dLon = (lon2 - lon1) * (Math.PI / 180);
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * (Math.PI / 180)) *
          Math.cos(lat2 * (Math.PI / 180)) *
          Math.sin(dLon / 2) *
          Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    function App() {
      const [selectedCategory, setSelectedCategory] = useState("all");
      const [dietFilter, setDietFilter] = useState("all");
      const [searchQuery, setSearchQuery] = useState("");
      
      const [cart, setCart] = useState([]);
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [customizingItem, setCustomizingItem] = useState(null);
      
      const [orderType, setOrderType] = useState("delivery");
      const [customerName, setCustomerName] = useState("");
      const [customerPhone, setCustomerPhone] = useState("");
      const [deliveryAddress, setDeliveryAddress] = useState("");
      const [landmark, setLandmark] = useState("");
      const [deliveryZone, setDeliveryZone] = useState("lawgate");
      const [gpsCoords, setGpsCoords] = useState(null);
      const [googleMapsUrl, setGoogleMapsUrl] = useState(null);
      const [specialInstructions, setSpecialInstructions] = useState("");
      const [formErrors, setFormErrors] = useState({});

      const [isLocationModalOpen, setIsLocationModalOpen] = useState(false);
      const [isOrderHistoryOpen, setIsOrderHistoryOpen] = useState(false);
      const [isFeedbackOpen, setIsFeedbackOpen] = useState(false);
      const [isDetectingLocation, setIsDetectingLocation] = useState(false);
      const [toastMessage, setToastMessage] = useState(null);

      const [orderHistory, setOrderHistory] = useState([]);
      const [feedbackRating, setFeedbackRating] = useState(5);
      const [feedbackCategory, setFeedbackCategory] = useState("Taste & Quality");
      const [feedbackComment, setFeedbackComment] = useState("");
      const [feedbacksList, setFeedbacksList] = useState([]);
      const [userId, setUserId] = useState(() => "user_" + Math.random().toString(36).substring(2, 9));

      useEffect(() => {
        try {
          const savedProfile = localStorage.getItem("wefsa_profile");
          if (savedProfile) {
            const parsed = JSON.parse(savedProfile);
            if (parsed.name) setCustomerName(parsed.name);
            if (parsed.phone) setCustomerPhone(parsed.phone);
            if (parsed.address) setDeliveryAddress(parsed.address);
            if (parsed.landmark) setLandmark(parsed.landmark);
            if (parsed.zone) setDeliveryZone(parsed.zone);
            if (parsed.coords) setGpsCoords(parsed.coords);
            if (parsed.mapsUrl) setGoogleMapsUrl(parsed.mapsUrl);
            if (parsed.userId) setUserId(parsed.userId);
          }

          const savedHistory = localStorage.getItem("wefsa_order_history");
          if (savedHistory) setOrderHistory(JSON.parse(savedHistory));

          const savedFeedbacks = localStorage.getItem("wefsa_feedbacks");
          if (savedFeedbacks) setFeedbacksList(JSON.parse(savedFeedbacks));
        } catch (e) {
          console.warn("Local cache read error", e);
        }
      }, []);

      const saveProfileLocally = (overrides = {}) => {
        try {
          const profile = {
            name: overrides.name !== undefined ? overrides.name : customerName,
            phone: overrides.phone !== undefined ? overrides.phone : customerPhone,
            address: overrides.address !== undefined ? overrides.address : deliveryAddress,
            landmark: overrides.landmark !== undefined ? overrides.landmark : landmark,
            zone: overrides.zone !== undefined ? overrides.zone : deliveryZone,
            coords: overrides.coords !== undefined ? overrides.coords : gpsCoords,
            mapsUrl: overrides.mapsUrl !== undefined ? overrides.mapsUrl : googleMapsUrl,
            userId: userId,
          };
          localStorage.setItem("wefsa_profile", JSON.stringify(profile));
        } catch (e) {
          console.warn("Storage save error", e);
        }
      };

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3000);
      };

      // --- ROBUST GPS DETECTION WITH DISTANCE + NORMALIZED KEYWORD MATCHER ---
      const handleDetectGPS = () => {
        if (!navigator.geolocation) {
          showToast("Geolocation is not supported on this browser.");
          return;
        }

        setIsDetectingLocation(true);
        navigator.geolocation.getCurrentPosition(
          async (pos) => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            const link = `https://maps.google.com/?q=${lat},${lng}`;
            setGpsCoords({ lat, lng });
            setGoogleMapsUrl(link);

            // Calculate exact geodesic distance from Law Gate center and AGI center
            const distToLawgate = calculateDistanceKm(lat, lng, LAWGATE_COORDS.lat, LAWGATE_COORDS.lng);
            const distToAgi = calculateDistanceKm(lat, lng, AGI_COORDS.lat, AGI_COORDS.lng);

            let detectedZone = "outside";
            let formattedAddress = `GPS: ${lat.toFixed(5)}, ${lng.toFixed(5)}`;
            let rawAddressText = "";

            try {
              const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`);
              if (res.ok) {
                const data = await res.json();
                formattedAddress = data.display_name || formattedAddress;
                rawAddressText = (data.display_name || "").toLowerCase();
              }
            } catch (err) {
              console.warn("Reverse geocode fallback", err);
            }

            // Clean string removing spaces and punctuation to prevent "law gate" vs "lawgate" mismatch
            const normalizedText = rawAddressText.replace(/[\s\-_,.]+/g, "");

            // 1. Check AGI Sector (by text or distance < 2.5 km)
            const isAgiMatch =
              rawAddressText.includes("agi") ||
              rawAddressText.includes("sky villas") ||
              rawAddressText.includes("skyvilla") ||
              rawAddressText.includes("smart homes") ||
              rawAddressText.includes("smarthomes") ||
              distToAgi < 2.5;

            // 2. Check Law Gate & Greenvalley
            // Matches "Law gate", "Lawgate", "Green Valley", "Greenvalley", "Maheru", "Chaheru", "LPU"
            // OR if customer's actual GPS location is within 3.0 km of Law Gate!
            const isLawgateMatch =
              rawAddressText.includes("law gate") ||
              rawAddressText.includes("lawgate") ||
              normalizedText.includes("lawgate") ||
              rawAddressText.includes("green valley") ||
              rawAddressText.includes("greenvalley") ||
              normalizedText.includes("greenvalley") ||
              rawAddressText.includes("maheru") ||
              rawAddressText.includes("meheru") ||
              rawAddressText.includes("chaheru") ||
              rawAddressText.includes("lpu") ||
              rawAddressText.includes("lovely professional") ||
              distToLawgate <= 3.0;

            if (isAgiMatch) {
              detectedZone = "agi";
            } else if (isLawgateMatch) {
              detectedZone = "lawgate";
            } else {
              detectedZone = "outside";
            }

            setDeliveryAddress(formattedAddress);
            setDeliveryZone(detectedZone);
            saveProfileLocally({ address: formattedAddress, coords: { lat, lng }, mapsUrl: link, zone: detectedZone });
            setIsDetectingLocation(false);

            const zoneName = detectedZone === "lawgate"
              ? "Lawgate & Greenvalley (Local Base)"
              : detectedZone === "agi"
              ? "AGI Sector"
              : "Outside Lawgate & Greenvalley";
              
            showToast(`📍 GPS Pinned: ${zoneName}`);
          },
          (err) => {
            setIsDetectingLocation(false);
            showToast("Could not access GPS. Please type address manually.");
          },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 }
        );
      };

      const filteredItems = useMemo(() => {
        return MENU_ITEMS.filter((item) => {
          const matchCat = selectedCategory === "all" || item.category === selectedCategory;
          let matchDiet = true;
          if (dietFilter === "veg") matchDiet = item.type === "veg";
          if (dietFilter === "non-veg") matchDiet = item.type === "non-veg" || item.type === "egg";
          if (dietFilter === "star") matchDiet = item.isStar || item.isMustTry;

          const matchSearch =
            item.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
            item.description.toLowerCase().includes(searchQuery.toLowerCase());

          return matchCat && matchDiet && matchSearch;
        });
      }, [selectedCategory, dietFilter, searchQuery]);

      const subtotal = useMemo(() => {
        return cart.reduce((sum, item) => sum + item.unitPrice * item.quantity, 0);
      }, [cart]);

      const activeZone = useMemo(() => {
        return DELIVERY_ZONES.find((z) => z.id === deliveryZone) || DELIVERY_ZONES[0];
      }, [deliveryZone]);

      const deliveryFee = useMemo(() => {
        if (orderType === "dinein" || subtotal === 0) return 0;
        if (activeZone.flatFee !== null) return activeZone.flatFee;
        if (subtotal >= activeZone.freeThreshold) return 0;
        return activeZone.belowThresholdFee;
      }, [subtotal, orderType, activeZone]);

      const grandTotal = subtotal + deliveryFee;
      const totalItemsCount = useMemo(() => cart.reduce((count, item) => count + item.quantity, 0), [cart]);

      const handleOpenCustomizer = (item) => {
        if (item.isPizza) {
          setCustomizingItem({
            ...item,
            selectedSize: "R",
            selectedCrust: PIZZA_CRUST_OPTIONS[0],
            selectedExtraCheese: false,
            selectedAddons: [],
            note: "",
            quantity: 1,
          });
        } else {
          setCustomizingItem({
            ...item,
            selectedSize: null,
            selectedCrust: null,
            selectedExtraCheese: false,
            selectedAddons: [],
            note: "",
            quantity: 1,
          });
        }
      };

      const getModalUnitPrice = () => {
        if (!customizingItem) return 0;
        let base = customizingItem.isPizza
          ? (customizingItem.prices[customizingItem.selectedSize] || 0)
          : (customizingItem.prices.default || 0);

        const crustPrice = customizingItem.selectedCrust ? customizingItem.selectedCrust.price : 0;
        const extraCheesePrice = customizingItem.selectedExtraCheese
          ? getExtraCheesePriceForSize(customizingItem.selectedSize)
          : 0;

        const addonsPrice = (customizingItem.selectedAddons || []).reduce((acc, a) => acc + a.price, 0);
        return base + crustPrice + extraCheesePrice + addonsPrice;
      };

      const handleAddCustomizedToCart = () => {
        if (!customizingItem) return;
        const unitPrice = getModalUnitPrice();
        const cartItemId = `${customizingItem.id}-${customizingItem.selectedSize || "std"}-${
          customizingItem.selectedCrust ? customizingItem.selectedCrust.id : "none"
        }-${customizingItem.selectedExtraCheese ? "xc" : "no-xc"}-${customizingItem.selectedAddons.map(a => a.id).sort().join("_")}-${encodeURIComponent(customizingItem.note || "")}`;

        const existingIdx = cart.findIndex((i) => i.cartItemId === cartItemId);
        if (existingIdx > -1) {
          const updated = [...cart];
          updated[existingIdx].quantity += customizingItem.quantity;
          setCart(updated);
        } else {
          setCart([
            ...cart,
            {
              cartItemId,
              name: customizingItem.name,
              isPizza: customizingItem.isPizza,
              type: customizingItem.type,
              selectedSize: customizingItem.selectedSize,
              selectedCrust: customizingItem.selectedCrust,
              selectedExtraCheese: customizingItem.selectedExtraCheese,
              selectedAddons: customizingItem.selectedAddons,
              note: customizingItem.note,
              unitPrice: unitPrice,
              quantity: customizingItem.quantity,
            },
          ]);
        }
        showToast(`Added ${customizingItem.name} to cart`);
        setCustomizingItem(null);
      };

      const handleQuickAdd = (item) => {
        if (item.isPizza) {
          handleOpenCustomizer(item);
          return;
        }
        const cartItemId = `${item.id}-quick`;
        const existingIdx = cart.findIndex((i) => i.cartItemId === cartItemId);
        if (existingIdx > -1) {
          const updated = [...cart];
          updated[existingIdx].quantity += 1;
          setCart(updated);
        } else {
          setCart([
            ...cart,
            {
              cartItemId,
              name: item.name,
              isPizza: false,
              type: item.type,
              selectedSize: null,
              selectedCrust: null,
              selectedExtraCheese: false,
              selectedAddons: [],
              note: "",
              unitPrice: item.prices.default,
              quantity: 1,
            },
          ]);
        }
        showToast(`Added ${item.name}`);
      };

      const updateCartItemQuantity = (cartItemId, delta) => {
        setCart(prev =>
          prev
            .map(item => {
              if (item.cartItemId === cartItemId) {
                const newQty = item.quantity + delta;
                return newQty > 0 ? { ...item, quantity: newQty } : null;
              }
              return item;
            })
            .filter(Boolean)
        );
      };

      const handleDispatchWhatsAppOrder = () => {
        const errors = {};
        if (!customerName.trim()) errors.name = "Name is required";
        if (!customerPhone.trim() || customerPhone.trim().length < 8) errors.phone = "Valid phone is required";
        if (orderType === "delivery" && !deliveryAddress.trim()) errors.address = "Address is required for delivery";

        if (Object.keys(errors).length > 0) {
          setFormErrors(errors);
          showToast("Please fill in required customer details.");
          return;
        }
        setFormErrors({});
        saveProfileLocally();

        const newOrderRecord = {
          orderId: "WF-" + Math.floor(100000 + Math.random() * 900000),
          createdAt: new Date().toLocaleDateString("en-IN", { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }),
          items: [...cart],
          grandTotal: grandTotal,
          deliveryZone: activeZone.name,
          orderType: orderType,
        };

        const updatedHistory = [newOrderRecord, ...orderHistory];
        setOrderHistory(updatedHistory);
        try {
          localStorage.setItem("wefsa_order_history", JSON.stringify(updatedHistory));
        } catch (e) {}

        let msg = `*NEW ORDER — ${STORE_CONFIG.name.toUpperCase()}*\n`;
        msg += `Order ID: ${newOrderRecord.orderId}\n`;
        msg += `--------------------------------\n`;
        msg += `Customer: ${customerName.trim()}\n`;
        msg += `Contact: ${customerPhone.trim()}\n`;
        msg += `Fulfillment: ${orderType === "delivery" ? "Home Delivery" : "Takeaway / Dine-In"}\n`;

        if (orderType === "delivery") {
          msg += `Delivery Zone: ${activeZone.name}\n`;
          msg += `Address: ${deliveryAddress.trim()}\n`;
          if (landmark.trim()) msg += `Landmark: ${landmark.trim()}\n`;
          if (googleMapsUrl) msg += `Live GPS Pin: ${googleMapsUrl}\n`;
        } else {
          msg += `Pickup Note / Table: ${deliveryAddress.trim() || "Dine-in at Restaurant"}\n`;
        }

        if (specialInstructions.trim()) {
          msg += `Kitchen Note: "${specialInstructions.trim()}"\n`;
        }
        msg += `--------------------------------\n`;

                  <div className="p-4 border-b border-zinc-800 flex items-center justify-between bg-zinc-900/60">
                    <div>
                      <h3 className="font-bold text-base text-zinc-100">Your Basket</h3>
                      <p className="text-[11px] text-zinc-400">{totalItemsCount} items selected</p>
                    </div>
                    <button onClick={() => setIsCartOpen(false)} className="text-zinc-400 hover:text-white p-1">
                      ✕
                    </button>
                  </div>

                  <div className="px-4 py-2 bg-zinc-900 border-b border-zinc-800 text-xs flex items-center justify-between">
                    <div>
                      <span className="text-zinc-400">Zone: </span>
                      <strong className="text-zinc-200">{activeZone.name}</strong>
                    </div>
                    <button
                      onClick={() => setIsLocationModalOpen(true)}
                      className="text-amber-400 hover:underline font-semibold text-[11px]"
                    >
                      Change
                    </button>
                  </div>

                  <div className="flex-1 overflow-y-auto p-4 space-y-3.5 divide-y divide-zinc-800/80">
                    {cart.length === 0 ? (
                      <div className="text-center py-20 text-zinc-500 text-xs">
                        <div className="text-3xl mb-2">🛒</div>
                        <p>Your basket is currently empty.</p>
                      </div>
                    ) : (
                      cart.map((item) => (
                        <div key={item.cartItemId} className="pt-3.5 first:pt-0">
                          <div className="flex items-start justify-between gap-2">
                            <div>
                              <div className="flex items-center gap-1.5">
                                <DietaryBadge type={item.type} />
                                <h4 className="font-semibold text-xs text-zinc-200">{item.name}</h4>
                              </div>
                              <div className="text-[11px] text-zinc-400 mt-0.5 space-y-0.5 pl-4">
                                {item.selectedSize && <div>Size: <span className="text-amber-400 font-semibold">{item.selectedSize === "R" ? "Regular" : item.selectedSize === "M" ? "Medium" : "Large"}</span></div>}
                                {item.selectedCrust && item.selectedCrust.id !== "standard" && <div>Crust: {item.selectedCrust.name} (+₹{item.selectedCrust.price})</div>}
                                {item.selectedExtraCheese && <div>Extra Mozzarella (+₹{getExtraCheesePriceForSize(item.selectedSize)})</div>}
                                {item.selectedAddons && item.selectedAddons.length > 0 && <div>Add-ons: {item.selectedAddons.map(a => a.name).join(", ")}</div>}
                                {item.note && <div className="italic text-zinc-500">"{item.note}"</div>}
                              </div>
                            </div>
                            <span className="font-mono font-bold text-xs text-zinc-200">
                              ₹{item.unitPrice * item.quantity}
                            </span>
                          </div>

                          <div className="mt-2.5 flex items-center justify-between pl-4">
                            <button
                              onClick={() => updateCartItemQuantity(item.cartItemId, -item.quantity)}
                              className="text-[11px] text-rose-400/80 hover:text-rose-400"
                            >
                              Remove
                            </button>
                            <div className="flex items-center border border-zinc-700 rounded bg-zinc-800">
                              <button onClick={() => updateCartItemQuantity(item.cartItemId, -1)} className="w-6 h-6 text-zinc-400 hover:text-white">-</button>
                              <span className="w-6 text-center font-mono text-xs">{item.quantity}</span>
                              <button onClick={() => updateCartItemQuantity(item.cartItemId, 1)} className="w-6 h-6 text-zinc-400 hover:text-white">+</button>
                            </div>
                          </div>
                        </div>
                      ))
                    )}

                    {cart.length > 0 && (
                      <div className="pt-5 space-y-3">
                        <div className="font-mono font-bold text-xs text-amber-400 uppercase tracking-wider">
                          Customer & Delivery Details
                        </div>

                        <div className="grid grid-cols-2 gap-2 bg-zinc-900 p-1 rounded-xl border border-zinc-800">
                          <button
                            onClick={() => setOrderType("delivery")}
                            className={`py-1.5 rounded-lg text-xs font-bold transition ${orderType === "delivery" ? "bg-amber-500 text-zinc-950" : "text-zinc-400"}`}
                          >
                            Delivery
                          </button>
                          <button
                            onClick={() => setOrderType("dinein")}
                            className={`py-1.5 rounded-lg text-xs font-bold transition ${orderType === "dinein" ? "bg-amber-500 text-zinc-950" : "text-zinc-400"}`}
                          >
                            Takeaway / Dine-In
                          </button>
                        </div>

                        <div className="space-y-2 text-xs">
                          <div>
                            <label className="text-[11px] text-zinc-400 block mb-0.5">Your Name *</label>
                            <input
                              type="text"
                              placeholder="e.g., Rohit Verma"
                              value={customerName}
                              onChange={(e) => setCustomerName(e.target.value)}
                              className={`w-full px-3 py-2 rounded-lg bg-zinc-900 border text-white text-xs ${formErrors.name ? "border-rose-500" : "border-zinc-800"}`}
                            />
                          </div>

                          <div>
                            <label className="text-[11px] text-zinc-400 block mb-0.5">WhatsApp Mobile *</label>
                            <input
                              type="tel"
                              placeholder="e.g., 9876543210"
                              value={customerPhone}
                              onChange={(e) => setCustomerPhone(e.target.value)}
                              className={`w-full px-3 py-2 rounded-lg bg-zinc-900 border text-white text-xs ${formErrors.phone ? "border-rose-500" : "border-zinc-800"}`}
                            />
                          </div>

                          {orderType === "delivery" && (
                            <div>
                              <div className="flex items-center justify-between mb-0.5">
                                <label className="text-[11px] text-zinc-400">Address / Flat / PG *</label>
                                <button
                                  type="button"
                                  onClick={() => setIsLocationModalOpen(true)}
                                  className="text-[10px] text-amber-400 hover:underline"
                                >
                                  Use GPS Pin
                                </button>
                              </div>
                              <textarea
                                rows={2}
                                placeholder="e.g., Room 204, Green PG, near Lawgate"
                                value={deliveryAddress}
                                onChange={(e) => setDeliveryAddress(e.target.value)}
                                className={`w-full px-3 py-2 rounded-lg bg-zinc-900 border text-white text-xs ${formErrors.address ? "border-rose-500" : "border-zinc-800"}`}
                              />
                            </div>
                          )}

                          <div>
                            <label className="text-[11px] text-zinc-400 block mb-0.5">Delivery Instruction</label>
                            <input
                              type="text"
                              placeholder="e.g., Call at hostel gate, send extra ketchup"
                              value={specialInstructions}
                              onChange={(e) => setSpecialInstructions(e.target.value)}
                              className="w-full px-3 py-2 rounded-lg bg-zinc-900 border border-zinc-800 text-white text-xs"
                            />
                          </div>
                        </div>
                      </div>
                    )}
                  </div>

                  {cart.length > 0 && (
                    <div className="p-4 bg-zinc-900 border-t border-zinc-800 space-y-3">
                      <div className="space-y-1 text-xs text-zinc-300">
                        <div className="flex justify-between">
                          <span>Subtotal</span>
                          <span className="font-mono">₹{subtotal}</span>
                        </div>
                        {orderType === "delivery" && (
                          <div className="flex justify-between">
                            <span>Delivery Fee ({activeZone.name})</span>
                            <span className="font-mono">{deliveryFee === 0 ? "FREE" : `₹${deliveryFee}`}</span>
                          </div>
                        )}
                        <div className="pt-2 border-t border-zinc-800 flex justify-between font-bold text-sm text-white">
                          <span>Total</span>
                          <span className="font-mono text-amber-400">₹{grandTotal}</span>
                        </div>
                      </div>

                      <button
                        onClick={handleDispatchWhatsAppOrder}
                        className="w-full py-3 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-zinc-950 font-bold text-xs flex items-center justify-center gap-2 shadow-lg transition active:scale-95"
                      >
                        <span>Send Order via WhatsApp</span>
                      </button>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {isLocationModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
              <div className="bg-[#111216] border border-zinc-800 rounded-2xl w-full max-w-md p-5 shadow-2xl animate-modal-in space-y-4">
                <div className="flex items-center justify-between border-b border-zinc-800 pb-3">
                  <div>
                    <h3 className="font-bold text-sm text-zinc-100">Set Delivery Location</h3>
                    <p className="text-[11px] text-zinc-400">Saved for all future orders</p>
                  </div>
                  <button onClick={() => setIsLocationModalOpen(false)} className="text-zinc-400 hover:text-white">✕</button>
                </div>

                <div className="p-3 rounded-xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-between">
                  <div>
                    <div className="font-bold text-xs text-zinc-200">Auto-Detect GPS</div>
                    <div className="text-[11px] text-zinc-400">Creates an exact pin and detects delivery zone</div>
                  </div>
                  <button
                    onClick={handleDetectGPS}
                    disabled={isDetectingLocation}
                    className="px-3 py-1.5 rounded-lg bg-amber-500 hover:bg-amber-400 text-zinc-950 font-bold text-xs disabled:opacity-50"
                  >
                    {isDetectingLocation ? "Locating..." : "Detect"}
                  </button>
                </div>

                <div>
                  <label className="text-xs font-bold text-zinc-300 block mb-2 font-mono">Select Zone</label>
                  <div className="space-y-1.5">
                    {DELIVERY_ZONES.map((zone) => (
                      <div
                        key={zone.id}
                        onClick={() => setDeliveryZone(zone.id)}
                        className={`p-2.5 rounded-xl border text-xs cursor-pointer flex items-center justify-between ${
                          deliveryZone === zone.id ? "bg-amber-500/10 border-amber-500 text-white" : "bg-zinc-900 border-zinc-800 text-zinc-400"
                        }`}
                      >
                        <div>
                          <div className="font-semibold text-zinc-200">{zone.name}</div>
                          <div className="text-[10px] text-zinc-500">{zone.description}</div>
                        </div>
                        <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-zinc-800 text-amber-400">{zone.badge}</span>
                      </div>
                    ))}
                  </div>
                </div>

                <div>
                  <label className="text-xs font-bold text-zinc-300 block mb-1">Detailed Address</label>
                  <textarea
                    rows={2}
                    value={deliveryAddress}
                    onChange={(e) => setDeliveryAddress(e.target.value)}
                    placeholder="Hostel, Flat number, Gate instructions..."
                    className="w-full p-2 rounded-lg bg-zinc-900 border border-zinc-800 text-white text-xs"
                  />
                </div>

                <button
                  onClick={() => {
                    saveProfileLocally();
                    setIsLocationModalOpen(false);
                    showToast("Delivery location updated!");
                  }}
                  className="w-full py-2.5 rounded-xl bg-amber-500 text-zinc-950 font-bold text-xs shadow-md"
                >
                  Save & Apply
                </button>
              </div>
            </div>
          )}

          {isOrderHistoryOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
              <div className="bg-[#111216] border border-zinc-800 rounded-2xl w-full max-w-lg max-h-[85vh] p-5 shadow-2xl animate-modal-in flex flex-col">
                <div className="flex items-center justify-between border-b border-zinc-800 pb-3">
                  <div>
                    <h3 className="font-bold text-sm text-zinc-100">Order History</h3>
                    <p className="text-[11px] text-zinc-400">Previous orders placed on this device</p>
                  </div>
                  <button onClick={() => setIsOrderHistoryOpen(false)} className="text-zinc-400 hover:text-white">✕</button>
                </div>

                <div className="flex-1 overflow-y-auto py-3 space-y-3">
                  {orderHistory.length === 0 ? (
                    <div className="text-center py-12 text-zinc-500 text-xs">No previous orders recorded yet.</div>
                  ) : (
                    orderHistory.map((ord, idx) => (
                      <div key={idx} className="p-3.5 rounded-xl bg-zinc-900/60 border border-zinc-800 text-xs space-y-2">
                        <div className="flex items-center justify-between">
                          <span className="font-mono font-bold text-amber-400">{ord.orderId}</span>
                          <span className="text-[10px] text-zinc-500">{ord.createdAt}</span>
                        </div>
                        <div className="text-zinc-300">
                          {ord.items.map(i => `${i.name} (x${i.quantity})`).join(", ")}
                        </div>
                        <div className="flex items-center justify-between pt-1 border-t border-zinc-800">
                          <span className="font-mono font-bold text-zinc-100">₹{ord.grandTotal}</span>
                          <button
                            onClick={() => {
                              setCart(ord.items);
                              setIsOrderHistoryOpen(false);
                              setIsCartOpen(true);
                              showToast("Items re-added to cart!");
                            }}
                            className="px-2.5 py-1 rounded bg-zinc-800 hover:bg-zinc-700 text-amber-400 font-semibold text-[11px]"
                          >
                            Reorder All
                          </button>
                        </div>
                      </div>
                    ))
                  )}
                </div>
              </div>
            </div>
          )}

          {isFeedbackOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
              <div className="bg-[#111216] border border-zinc-800 rounded-2xl w-full max-w-md max-h-[90vh] p-5 shadow-2xl animate-modal-in flex flex-col space-y-4">
                <div className="flex items-center justify-between border-b border-zinc-800 pb-2">
                  <div>
                    <h3 className="font-bold text-sm text-zinc-100">Diner Feedback</h3>
                    <p className="text-[11px] text-zinc-400">Share your culinary experience</p>
                  </div>
                  <button onClick={() => setIsFeedbackOpen(false)} className="text-zinc-400 hover:text-white">✕</button>
                </div>

                <form onSubmit={handleSubmitFeedback} className="space-y-3 text-xs">
                  <div>
                    <label className="text-[11px] text-zinc-400 block mb-1">Rating</label>
                    <div className="flex gap-2">
                      {[1, 2, 3, 4, 5].map((star) => (
                        <button
                          type="button"
                          key={star}
                          onClick={() => setFeedbackRating(star)}
                          className={`w-8 h-8 rounded-lg font-mono font-bold ${
                            feedbackRating >= star ? "bg-amber-500 text-zinc-950" : "bg-zinc-900 border border-zinc-800 text-zinc-400"
                          }`}
                        >
                          ★
                        </button>
                      ))}
                    </div>
                  </div>

                  <div>
                    <label className="text-[11px] text-zinc-400 block mb-1">Category</label>
                    <select
                      value={feedbackCategory}
                      onChange={(e) => setFeedbackCategory(e.target.value)}
                      className="w-full p-2 rounded-lg bg-zinc-900 border border-zinc-800 text-white text-xs"
                    >
                      <option>Taste & Crust Quality</option>
                      <option>Late Night Delivery Speed</option>
                      <option>Packaging & Temperature</option>
                      <option>Overall Satisfaction</option>
                    </select>
                  </div>

                  <div>
                    <label className="text-[11px] text-zinc-400 block mb-1">Your Review</label>
                    <textarea
                      rows={3}
                      required
                      placeholder="Tell us what you loved or what we can improve..."
                      value={feedbackComment}
                      onChange={(e) => setFeedbackComment(e.target.value)}
                      className="w-full p-2.5 rounded-lg bg-zinc-900 border border-zinc-800 text-white text-xs"
                    />
                  </div>

                  <button
                    type="submit"
                    className="w-full py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-zinc-950 font-bold text-xs shadow-md"
                  >
                    Submit Review
                  </button>
                </form>

                <div className="border-t border-zinc-800 pt-3">
                  <div className="font-mono text-[11px] text-zinc-400 mb-2">Recent Community Reviews</div>
                  <div className="max-h-36 overflow-y-auto space-y-2 text-xs">
                    {feedbacksList.length === 0 ? (
                      <div className="text-zinc-600 text-[11px]">No reviews yet. Be the first!</div>
                    ) : (
                      feedbacksList.map((f, i) => (
                        <div key={i} className="p-2 rounded bg-zinc-900 border border-zinc-800/80">
                          <div className="flex items-center justify-between text-[10px]">
                            <span className="font-semibold text-zinc-300">{f.name}</span>
                            <span className="text-amber-400 font-mono">{"★".repeat(f.rating)}</span>
                          </div>
                          <p className="text-[11px] text-zinc-400 mt-0.5">{f.comment}</p>
                        </div>
                      ))
                    )}
                  </div>
                </div>
              </div>
            </div>
          )}

          <footer className="bg-zinc-950 border-t border-zinc-800 py-6 px-4 sm:px-6 text-zinc-500 text-xs">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4 text-center sm:text-left">
              <div>
                <p className="font-semibold text-zinc-300">{STORE_CONFIG.name} — {STORE_CONFIG.location}</p>
                <p className="text-[11px] mt-0.5">Late Night Pizza Kitchen • 05:00 PM to 04:00 AM</p>
              </div>
              <div className="text-[11px] font-mono text-zinc-500">
                Direct WhatsApp Dispatch • Powered by Modern Web Standards
              </div>
            </div>
          </footer>

          {cart.length > 0 && !isCartOpen && (
            <div className="fixed bottom-4 inset-x-4 z-40 md:hidden">
              <button
                onClick={() => setIsCartOpen(true)}
                className="w-full bg-amber-500 text-zinc-950 p-3 rounded-xl shadow-2xl flex items-center justify-between font-bold active:scale-95 transition"
              >
                <div className="flex items-center gap-2">
                  <span className="bg-zinc-950 text-amber-400 text-xs px-2 py-0.5 rounded font-mono font-bold">
                    {totalItemsCount}
                  </span>
                  <span className="text-xs">View Basket</span>
                </div>
                <div className="font-mono font-black text-sm">
                  ₹{grandTotal}
                </div>
              </button>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
